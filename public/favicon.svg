<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="loomGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="60%" stop-color="#e5b85a" />
      <stop offset="100%" stop-color="#926219" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0d0a11" stroke="#e5b85a" stroke-width="1.5" />
  <!-- Celestial Golden Spindle / D20 Geometry -->
  <polygon points="32,8 52,20 52,44 32,56 12,44 12,20" stroke="url(#loomGold)" stroke-width="1.8" fill="rgba(229, 184, 90, 0.08)" />
  <!-- Inner Cross Filaments -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#e5b85a" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="12" y1="20" x2="52" y2="44" stroke="#e5b85a" stroke-width="1" opacity="0.6" />
  <line x1="12" y1="44" x2="52" y2="20" stroke="#e5b85a" stroke-width="1" opacity="0.6" />
  <!-- Center Runic Star -->
  <circle cx="32" cy="32" r="5" fill="url(#loomGold)" filter="url(#glow)" />
  <path d="M32 18 L34 29 L45 32 L34 35 L32 46 L30 35 L19 32 L30 29 Z" fill="#fde68a" />
</svg>
